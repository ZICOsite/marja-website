# HTTP → HTTPS редирект
server {
    listen 80;
    server_name marja.uz www.marja.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name marja.uz www.marja.uz;

    ssl_certificate     /etc/letsencrypt/live/marja.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marja.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Максимальный размер загружаемых файлов (для медиа в Payload)
    client_max_body_size 50m;

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Любой другой Host (заход по IP сервера, чужие домены) → на marja.uz.
# Без этих блоков nginx отдавал сайт по первому серверу, и https://<IP>/
# открывал полную копию сайта: она попадала в Метрику и могла попасть в поиск.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://marja.uz$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Сертификат выписан на marja.uz — браузер предупредит о несовпадении,
    # но после подтверждения сразу уйдёт на домен. Сайт по IP больше не отдаём.
    ssl_certificate     /etc/letsencrypt/live/marja.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marja.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://marja.uz$request_uri;
}
